# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GENFT_6F456 }}
          channelId: live
          projectId: genft-6f456

  build_and_deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Stripe config file
        run: |
          cat > functions/env.config.js << 'EOF'
          export const STRIPE_APIKEY = "${{ secrets.STRIPE_APIKEY }}";
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Write Firebase credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GENFT_6F456 }}' > "$RUNNER_TEMP/gcp-key.json"
      - name: Deploy functions
        run: npx --yes firebase-tools@latest deploy --only functions --project genft-6f456
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json

