name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GENFT_6F456 }}
          channelId: live
          projectId: genft-6f456

  build_and_deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Stripe config file
        run: |
          cat > functions/env.config.js << 'EOF'
          export const STRIPE_APIKEY = "${{ secrets.STRIPE_APIKEY }}";
          EOF
      - run: npm ci && firebase deploy --only functions

